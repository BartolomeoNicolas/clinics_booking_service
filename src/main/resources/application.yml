# clinics_booking_service
#
# REGLA DE ESTE ARCHIVO: no contiene ningun secreto. Solo placeholders.
# Los valores reales entran por spring.config.import, desde .env o desde
# ~/.config/clinics/secrets/booking.yml. Ver .env.example.
#
# Criterio de arranque: si falta un secreto requerido, la app NO arranca y el
# error nombra la variable que falta.

spring:
  application:
    name: clinics-booking-service
  profiles:
    default: dev

  kafka:
    # Broker de la catedra. Lo da la catedra en el documento de integracion.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  config:
    import:
      # .env local del repo, leido como properties. "optional" porque el archivo
      # puede no existir: lo que falla despues es el placeholder sin default.
      - "optional:file:.env[.properties]"
      # Ubicacion canonica, fuera del repo. CLINICS_SECRETS_DIR la sobreescribe.
      - "optional:file:${CLINICS_SECRETS_DIR:${user.home}/.config/clinics/secrets}/booking.yml"
      - "optional:file:${CLINICS_SECRETS_DIR:${user.home}/.config/clinics/secrets}/booking.yaml"
      # Valores compartidos con el servicio de catalogo: la audiencia del token
      # de sesion y donde esta la clave publica.
      - "optional:file:${CLINICS_SECRETS_DIR:${user.home}/.config/clinics/secrets}/common.yml"

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

clinics:
  catalog:
    # URL del servicio de catalogo. En los tests de contrato se pisa desde afuera
    # para apuntar a WireMock. Es el unico valor de este bloque que no cambia por
    # perfil: hacia donde apunta un servicio es lo mismo en dev y en produccion.
    base-url: ${CLINICS_CATALOG_BASE_URL:http://localhost:8081}
    # Identidad de este servicio dentro del JWT tecnico que se le manda al catalogo.
    service-name: ${CLINICS_CATALOG_SERVICE_NAME:clinics-booking}
    # Un catalogo caido no puede dejar a turnos colgado. Se traduce en
    # catalog-unavailable (503) con la causa original adjunta.
    connect-timeout-ms: ${CLINICS_CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CLINICS_CATALOG_READ_TIMEOUT_MS:5000}

  catedra:
    # URL del servicio central de la catedra. Mismos nombres de variable que en el
    # servicio de sincronizacion, porque los dos hablan con la misma catedra y el
    # operador no deberia tener que acordarse de dos nombres para un solo valor.
    base-url: ${CATEDRA_BASE_URL:http://172.17.201.1:8090}
    # Cuenta tecnica, la misma que usa el servicio de sincronizacion. Quedan vacias
    # hasta registrarla, y NO son obligatorias al arrancar: la cuenta se da de alta
    # una sola vez y un servicio sin credenciales tiene que poder levantar. Lo que si
    # es obligatorio es la URL. Si faltan las credenciales, el error nombra la falta
    # en el momento de usarlas.
    technical-user: ${CATEDRA_TECHNICAL_USER:}
    technical-password: ${CATEDRA_TECHNICAL_PASSWORD:}
    # JWT tecnico guardado al registrar. Opcional: si esta y alcanza ahorra un login;
    # si no esta o vencio, el emisor pide uno nuevo y el renovado queda solo en memoria.
    technical-jwt: ${CATEDRA_TECHNICAL_JWT:}
    # Un timeout por operacion, y no uno global. Leer ocupaciones es lo que espera el
    # usuario con la pantalla abierta; confirmar un reten pone en marcha la creacion
    # de la reserva y un timeout agresivo ahi deja un reten tomado del otro lado sin
    # que nadie sepa si se confirmo.
    connect-timeout-ms: ${CATEDRA_CONNECT_TIMEOUT_MS:2000}
    occupancies-read-timeout-ms: ${CATEDRA_OCCUPANCIES_READ_TIMEOUT_MS:3000}
    appointments-read-timeout-ms: ${CATEDRA_APPOINTMENTS_READ_TIMEOUT_MS:5000}
    create-hold-timeout-ms: ${CATEDRA_CREATE_HOLD_TIMEOUT_MS:5000}
    confirm-hold-timeout-ms: ${CATEDRA_CONFIRM_HOLD_TIMEOUT_MS:8000}
    cancel-timeout-ms: ${CATEDRA_CANCEL_TIMEOUT_MS:5000}
    # Reintentos extra SOLO para las dos lecturas. Un timeout no prueba que una
    # operacion con efectos haya fallado (anexo 18.4), asi que las escrituras no
    # se repiten nunca desde el cliente.
    read-retries: ${CATEDRA_READ_RETRIES:2}

    # Kafka de la catedra. Los topics los crea la catedra y llevan nuestro groupId.
    kafka:
      # El consumidor se puede apagar para levantar el servicio sin Kafka (por
      # ejemplo, en un entorno donde todavia no hay broker de pruebas).
      enabled: ${CATEDRA_KAFKA_ENABLED:true}
      actions-topic: ${CATEDRA_ACTIONS_TOPIC:alumnos.turnos.acciones.nicobartok0-prog2}
      phone-topic: ${CATEDRA_PHONE_TOPIC:catedra.turnos.telefono.nicobartok0-prog2}
      # Un grupo por servicio: si dos servicios compartieran el grupo, se repartirian
      # los mensajes y cada uno recibiria la mitad.
      consumer-group: ${CATEDRA_CONSUMER_GROUP:clinics-booking}
      # Reintentos con tope ante un error recuperable. Acotados a proposito: un error
      # que se repite no se arregla insistiendo.
      retries: ${CATEDRA_KAFKA_RETRIES:3}
      retry-interval-ms: ${CATEDRA_KAFKA_RETRY_INTERVAL_MS:1000}

---
# Perfil de desarrollo local.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Sin default a proposito. La validacion de clinics.local.db-password es la que
    # hace fallar el arranque nombrando la variable que falta.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55433}/${DB_NAME:clinics_booking}
    username: ${DB_USER:booking_app}
    password: ${clinics.local.db-password}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # El esquema es de Liquibase, nunca de Hibernate. Vease BOOK-M0-03.
      ddl-auto: none
    open-in-view: false
  liquibase:
    # Aplicado en el arranque. Ver db/changelog/db.changelog-master.xml.
    # OJO: no poner `contexts` acá. En Liquibase eso FILTRA los changesets que
    # no lleven esa etiqueta, en vez de activarlos: la app levanta sin error y
    # no crea ninguna tabla.
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Secretos locales. La validacion (@NotBlank) hace que falte uno rompa el arranque.
clinics:
  local:
    db-password: ${DB_PASSWORD:}

  security:
    jwt:
      # La privada sale de este servicio y no se comparte. La publica la escribe
      # este servicio y la lee el de catalogo.
      private-key-path: ${CLINICS_JWT_PRIVATE_KEY_PATH:${user.home}/.config/clinics/secrets/jwt-private.pem}
      public-key-path: ${CLINICS_JWT_PUBLIC_KEY_PATH:${user.home}/.config/clinics/secrets/jwt-public.pem}
      # La misma audiencia que usa el servicio de catalogo: la app KMP consume
      # las dos APIs con un solo token de sesion.
      audience: ${CLINICS_JWT_AUDIENCE:clinics}
      issuer: ${CLINICS_JWT_ISSUER:clinics-booking}
      # Rotacion del par: ponerlo en true regenera la clave en el proximo arranque.
      rotate: ${CLINICS_JWT_ROTATE:false}
      key-size: ${CLINICS_JWT_KEY_SIZE:2048}

logging:
  level:
    com.bartolomeo.clinics: DEBUG

---
# Perfil de tests.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55433}/${DB_NAME:clinics_booking_test}
    username: ${DB_USER:booking_app}
    password: ${clinics.local.db-password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

clinics:
  local:
    db-password: ${DB_PASSWORD:}
  security:
    jwt:
      private-key-path: ${CLINICS_JWT_PRIVATE_KEY_PATH:${user.home}/.config/clinics/secrets/jwt-private.pem}
      public-key-path: ${CLINICS_JWT_PUBLIC_KEY_PATH:${user.home}/.config/clinics/secrets/jwt-public.pem}
      audience: clinics
      issuer: clinics-booking
      rotate: false

logging:
  level:
    com.bartolomeo.clinics: INFO